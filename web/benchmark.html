<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>头模质量回归 · 五样本</title>
<style>
:root{color-scheme:dark;font:15px/1.6 system-ui,sans-serif;background:#11151c;color:#e6edf5}*{box-sizing:border-box}body{margin:0 auto;padding:28px;max-width:1400px}a{color:#8dc9ff}h1{font-size:26px;margin:0}p{color:#abb8ca}header{display:flex;justify-content:space-between;align-items:center;gap:20px}button,select,input,textarea{font:inherit;background:#202b3b;color:#e6edf5;border:1px solid #45566d;border-radius:7px;padding:7px 10px}button{cursor:pointer}button:hover{background:#2e435d}.metrics{display:flex;gap:12px;flex-wrap:wrap;margin:22px 0}.metric{padding:16px;background:#1b2431;border-radius:10px;min-width:145px}.metric b{display:block;font-size:25px}.case{border:1px solid #38465a;border-radius:12px;padding:20px;margin:22px 0}.trials{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}.trial{background:#19212d;border-radius:9px;padding:16px;min-width:0}.pair{display:grid;grid-template-columns:1fr 2fr;gap:8px}.pair img{width:100%;height:230px;object-fit:contain;background:#0a0d13}.muted{color:#a4b2c6;font-size:13px}label{display:block;margin-top:10px}textarea{width:100%;min-height:75px}input[type=number]{width:120px}.bad{color:#f5c176}.error{color:#ff9e9e}.review{border-top:1px solid #36445b;margin-top:15px;padding-top:10px}#message{min-height:25px}details{margin:10px 0}pre{white-space:pre-wrap;word-break:break-word;font-size:12px}.tools{display:flex;gap:10px;flex-wrap:wrap}select{max-width:100%}@media(max-width:800px){body{padding:16px}.trials{grid-template-columns:1fr}header{align-items:flex-start;flex-direction:column}.pair img{height:190px}}
</style></head><body>
<header><div><h1>头模质量回归</h1><p>固定原图 · 独立重复生成 · 人工验收 · 成本与返修记录</p></div><div class="tools"><a href="/">返回生成与 3D 预览</a><button id="refresh">刷新记录</button><button id="export">导出报告 JSON</button></div></header>
<p>每张原图的哈希固定。两次生成只能提供初步波动证据；没有填写评价的模型显示“待评”。AI 检查意见单独展示，不计入客户可用率。阶段耗时包含服务排队；等待确认时间不等于美术返修时间。每个可用模型成本包含所选组所有试验积分，只在该组模型全部人工评价后计算。</p>
<label>试验组 <select id="group"><option value="">全部组</option></select></label><div id="message" role="status"></div><div id="metrics" class="metrics"></div><main id="cases"></main>
<script type="module" src="/benchmark.js"></script></body></html>
